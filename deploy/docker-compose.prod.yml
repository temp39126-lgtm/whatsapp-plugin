services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    # Avoid fatal crash when diagnostic.data cannot be written (common on full disks).
    command: ["mongod", "--setParameter", "diagnosticDataCollectionEnabled=false"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 40s

  minio:
    image: quay.io/minio/aistor/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal

  minio-init:
    image: quay.io/minio/aistor/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb local/$$S3_BUCKET --ignore-existing &&
      echo 'MinIO bucket ready'
      "
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/whatsapp_crm?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      META_APP_SECRET: ${META_APP_SECRET}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      CALLING_ENABLED: ${CALLING_ENABLED:-true}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      RUN_SEED_ON_START: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-}
      PUBLIC_USER_SIGNUP_ENABLED: ${PUBLIC_USER_SIGNUP_ENABLED:-false}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-500}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-60}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL}
        NEXT_PUBLIC_SOCKET_URL: ${APP_URL}
        NEXT_PUBLIC_PUBLIC_USER_SIGNUP_ENABLED: ${PUBLIC_USER_SIGNUP_ENABLED:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      # Proxy /api and /socket.io to Express when traffic hits the Next server (no edge proxy on /api).
      BACKEND_INTERNAL_URL: http://backend:5000
    networks:
      - internal

volumes:
  mongo_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
