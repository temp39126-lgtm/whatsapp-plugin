# Host nginx in front of Docker (frontend binds 127.0.0.1:3004 in docker-compose.prod.yml).
# Copy to /etc/nginx/sites-available/wa.zenablers.com and enable the site.
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites: docker compose up — frontend and backend healthy.

server {
    listen 80;
    server_name wa.zenablers.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wa.zenablers.com;

    # Replace with your cert paths (certbot, etc.)
    ssl_certificate     /etc/letsencrypt/live/wa.zenablers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.zenablers.com/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}